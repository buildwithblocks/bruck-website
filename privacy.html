<!-- PRIVACY -->
<section data-m-onder style="padding: var(--sec-m) clamp(16px, 3.6vw, 52px) 0">
  <div style="max-width: 1240px; margin: 0 auto">
    <span style="display: block; font-size: 14px; font-weight: 700; color: #DFA701; text-transform: uppercase">Privacy</span>
    <h1 style="margin: var(--label-kop) 0 0; font-family: 'Factory Sans', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 600; letter-spacing: -0.03em; text-transform: uppercase; color: #FFFFFF; font-size: clamp(40px, 5.6vw, 76px); line-height: 1">Privacy&shy;verklaring</h1>
    <p style="margin: var(--sp-24) 0 0; max-width: 620px; font-size: 17px; line-height: 1.6; color: rgba(255,255,255,0.75)">Hier lees je welke gegevens we via deze website verzamelen, waarvoor we ze gebruiken en wat je rechten zijn.</p>
    <p style="margin: 12px 0 0; font-size: 14px; color: rgba(255,255,255,0.55)">Laatst bijgewerkt: 25 november 2026</p>
    <div style="max-width: 760px; margin-top: var(--sp-24)"><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Wie wij zijn</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">Brück Dak en Zinkwerk is het dakdekkersbedrijf van Nicky van Brück, Goudwindestraat 39, 6576 CD Ooij, KvK 85783439. Wij zijn verantwoordelijk voor de verwerking van de gegevens die je via deze website aan ons geeft. Vragen over je gegevens kun je mailen naar <a href="mailto:bruckdakenzinkwerk@outlook.com" style="color: #DFA701; text-decoration: underline; text-underline-offset: 3px">bruckdakenzinkwerk@outlook.com</a> of stellen via 06 19 62 33 66.</p><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Welke gegevens we gebruiken en waarvoor</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)"><strong style="color: #FFFFFF">Dakscan.</strong> Je vult je postcode en huisnummer in en beantwoordt twee vragen over je dak. Wil je het dakrapport ontvangen, dan vragen we ook je naam, e-mailadres en telefoonnummer, en eventueel je vraag. We gebruiken dit om je rapport te maken en te mailen, en om contact met je op te nemen als je om een inspectie vraagt.</p><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)"><strong style="color: #FFFFFF">Subsidiecheck.</strong> Je adres, naam, e-mailadres en telefoonnummer gebruiken we om je een indicatie van de subsidie te geven. Nicky neemt alleen contact op als je daar toestemming voor geeft.</p><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)"><strong style="color: #FFFFFF">Contactformulier, WhatsApp, telefoon en e-mail.</strong> We gebruiken wat je ons stuurt om je vraag te beantwoorden en, als je dat wilt, een afspraak of offerte te maken. Stuur je een appje, dan gelden daarnaast de voorwaarden van WhatsApp.</p><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)"><strong style="color: #FFFFFF">Als je klant wordt.</strong> Voor de offerte, de uitvoering en de factuur bewaren we je naam, adres, contactgegevens en de afspraken over het werk.</p><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">We verwerken deze gegevens omdat je ons om iets vraagt (een rapport, een check, een offerte), omdat we een overeenkomst met je uitvoeren, of omdat de wet dat verplicht, zoals bij facturen.</p><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Adresgegevens uit openbare bronnen</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">Voor de dakscan zoeken we je postcode en huisnummer op bij PDOK (Kadaster en het ministerie van BZK) en bij 3D BAG. Zo vinden we het bouwjaar, het dakoppervlak en de luchtfoto van je woning. Daarbij sturen we alleen het adres mee, niet je naam of contactgegevens.</p><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Wie je gegevens nog meer ziet</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">We verkopen je gegevens niet en geven ze niet door voor reclame. Voor het draaien van de website en het versturen van e-mail werken we met een paar bedrijven die je gegevens alleen in onze opdracht verwerken:</p><ul style="margin: 12px 0 0; padding: 0 0 0 20px; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)"><li style="font-size: 16px; margin-top: 6px">Vercel: hosting van de website</li><li style="font-size: 16px; margin-top: 6px">Resend: het versturen van het dakrapport en de bevestigingsmails</li><li style="font-size: 16px; margin-top: 6px">Microsoft (Outlook): de mailbox van Nicky, waar je aanvraag binnenkomt</li><li style="font-size: 16px; margin-top: 6px">Build with Blocks: de bouwer van de website, voor technisch beheer</li></ul><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">Een deel van deze bedrijven zit in de Verenigde Staten. Zij werken met de afspraken die de Europese Unie daarvoor heeft goedgekeurd, zoals het EU-VS-gegevensprivacykader of standaardcontractbepalingen.</p><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Statistieken en cookies</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">We meten hoe de website wordt gebruikt met Vercel Web Analytics. Dat werkt zonder cookies en zonder dat we kunnen zien wie je bent: we zien bijvoorbeeld hoeveel mensen de dakscan starten of op de WhatsApp-knop drukken.</p><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">De website plaatst geen tracking- of advertentiecookies. Vul je op de homepage je adres in, dan onthoudt je browser dat tijdelijk, zodat je het in de dakscan niet opnieuw hoeft te typen. Dat verdwijnt zodra je het tabblad sluit. Om misbruik van de formulieren tegen te gaan, kijken we kort naar je IP-adres; dat slaan we niet op.</p><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Hoe lang we je gegevens bewaren</h2><ul style="margin: 12px 0 0; padding: 0 0 0 20px; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)"><li style="font-size: 16px; margin-top: 6px">Aanvragen via de dakscan, de subsidiecheck of het contactformulier waar geen opdracht uit volgt: maximaal 2 jaar.</li><li style="font-size: 16px; margin-top: 6px">Gegevens van klanten, offertes en facturen: 7 jaar, omdat de Belastingdienst dat verplicht.</li></ul><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Beveiliging</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">De website gebruikt een beveiligde verbinding (https). Alleen Nicky en de partijen hierboven kunnen bij je gegevens, en alleen voor het doel waarvoor je ze hebt gegeven.</p><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Jouw rechten</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">Je mag altijd vragen welke gegevens we van je hebben, ze laten aanpassen of laten verwijderen. Je kunt ook bezwaar maken, je toestemming intrekken of vragen om je gegevens in een bestand te krijgen. Mail daarvoor naar <a href="mailto:bruckdakenzinkwerk@outlook.com" style="color: #DFA701; text-decoration: underline; text-underline-offset: 3px">bruckdakenzinkwerk@outlook.com</a>. We reageren binnen een maand.</p><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">Ben je het niet eens met hoe we met je gegevens omgaan? Laat het ons eerst weten. Je kunt ook een klacht indienen bij de <a href="https://www.autoriteitpersoonsgegevens.nl" target="_blank" rel="noopener" style="color: #DFA701; text-decoration: underline; text-underline-offset: 3px">Autoriteit Persoonsgegevens</a>.</p><h2 style="margin: var(--sp-48) 0 0; font-family: 'Saira', 'Helvetica Neue', 'Helvetica', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.3; letter-spacing: 0; color: #FFFFFF">Wijzigingen</h2><p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.78)">Als we deze privacyverklaring aanpassen, zie je dat op deze pagina. Bovenaan staat wanneer de tekst voor het laatst is bijgewerkt.</p></div>
