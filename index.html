(function(){
  const comp=new Component(); let vals=comp.renderVals();
  const binds=[];
  const H=/\{\{\s*([^}]+?)\s*\}\}/g;
  function get(path,scope){const parts=path.split('.');let v=(parts[0] in scope)?scope[parts[0]]():vals[parts[0]];for(let i=1;i<parts.length;i++){if(v==null)return v;v=v[parts[i]];}return v;}
  function interp(str,scope){return str.replace(H,(m,p)=>{const v=get(p.trim(),scope);return v==null?'':String(v);});}
  function walk(node,scope){
    if(node.nodeType===3){if(H.test(node.nodeValue)){H.lastIndex=0;const tpl=node.nodeValue;const f=()=>{node.nodeValue=interp(tpl,scope)};f();binds.push(f);}H.lastIndex=0;return;}
    if(node.nodeType!==1)return;
    const tag=node.tagName.toLowerCase();
    if(tag==='sc-for'){
      const lp=node.getAttribute('list').replace(/[{}\s]/g,'');const as=node.getAttribute('as');
      const list=get(lp,scope)||[];const frag=document.createDocumentFragment();
      list.forEach((_,i)=>{const sc=Object.assign({},scope);sc[as]=()=>(get(lp,scope)||[])[i];
        Array.from(node.childNodes).forEach(ch=>{const c=ch.cloneNode(true);frag.appendChild(c);walk(c,sc);});});
      node.replaceWith(frag);return;
    }
    if(tag==='sc-if'){
      const vp=node.getAttribute('value').replace(/[{}\s]/g,'');const w=document.createElement('span');w.style.display='contents';
      Array.from(node.childNodes).forEach(ch=>w.appendChild(ch));node.replaceWith(w);
      const f=()=>{w.style.display=get(vp,scope)?'contents':'none'};f();binds.push(f);
      Array.from(w.childNodes).forEach(c=>walk(c,scope));return;
    }
    Array.from(node.attributes).forEach(a=>{
      const n=a.name,v=a.value;
      if(n.startsWith('hint-')){node.removeAttribute(n);return;}
      if(/^on/i.test(n)&&/\{\{/.test(v)){node.removeAttribute(n);const p=v.replace(/[{}\s]/g,'');
        const ev={onclick:'click',onmouseenter:'mouseenter',onmouseleave:'mouseleave',onchange:'input'}[n.toLowerCase()]||n.slice(2).toLowerCase();
        node.addEventListener(ev,e=>{const fn=get(p,scope);if(typeof fn==='function'){if(ev==='click'&&node.tagName==='A'&&node.getAttribute('href')==='#')e.preventDefault();fn(e);}});return;}
      if(/\{\{/.test(v)){const f=()=>{const x=interp(v,scope);node.setAttribute(n,x);if(n==='value'&&node.value!==x)node.value=x;};f();binds.push(f);}
    });
    if(tag==='a'&&node.getAttribute('href')==='#')node.addEventListener('click',e=>e.preventDefault());
    Array.from(node.childNodes).forEach(c=>walk(c,scope));
  }
  const root=document.getElementById('dc-root');
  const t=document.getElementById('dc-tpl').content.cloneNode(true);
  Array.from(t.childNodes).forEach(c=>walk(c,{}));root.appendChild(t);
  window.__comp=comp;window.__dcUpdate=()=>{vals=comp.renderVals();binds.forEach(f=>f());};
})();

<script>
/* Dakscan-balk: hele vak "Is het dak ooit vernieuwd?" opent de keuzelijst, en de antwoorden gaan mee naar de dakscan. */
(function(){
  var form=document.getElementById('dakscan-balk'); if(!form) return;
  var pc=document.getElementById('ds-pc'), nr=document.getElementById('ds-nr'), q1=document.getElementById('ds-q1');
  var veld=document.getElementById('ds-q1-veld'), start=document.getElementById('ds-start');
  veld.addEventListener('click', function(e){
    if (e.target === q1) return;
    e.preventDefault(); q1.focus();
    try { if (q1.showPicker) q1.showPicker(); } catch (err) {}
  });
  q1.addEventListener('change', function(){ q1.style.color = '#FFFFFF'; });
  function go(e){
    e.preventDefault();
    var data = { pc: pc.value.trim(), nr: nr.value.trim(), q1: q1.value || '' };
    try { sessionStorage.setItem('bruck-dakscan', JSON.stringify(data)); } catch (err) {}
    location.href = '/dakscan';
  }
  start.addEventListener('click', go);
  form.addEventListener('submit', go);
  // Past de balk niet meer op 1 regel? Dan alleen de knop "Start dakscan" (die gaat naar de dakscan).
  var velden=[].slice.call(form.querySelectorAll('label'));
  function pas(){
    form.classList.remove('alleen-knop');
    // Desktop (vanaf 1200px, zelfde grens als het menu): altijd de volledige balk op 1 regel; de velden krimpen mee.
    var past = window.matchMedia('(min-width: 1200px)').matches || (start.offsetTop <= velden[0].offsetTop + 4 && velden.every(function(v){ return v.offsetTop === velden[0].offsetTop; }));
    form.classList.toggle('alleen-knop', !past);
    document.documentElement.classList.toggle('ds-smal', !past);
    if (window.__dsLayout) window.__dsLayout();
  }
  if (window.ResizeObserver) new ResizeObserver(function(){ requestAnimationFrame(pas); }).observe(form.parentNode);
  addEventListener('resize', pas); pas();
  // Opnieuw meten zodra de webfonts en de pagina geladen zijn: met het reservefont past de balk soms net niet.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ requestAnimationFrame(pas); });
  addEventListener('load', function(){ requestAnimationFrame(pas); });
})();
</script>
