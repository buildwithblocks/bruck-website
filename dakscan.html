  // Adres opzoeken en de dakgegevens ophalen (js/dakscan-data.js). Bij succes door naar stap 2.

    const v1 = /^\d{4}\s?[A-Za-z]{2}$/.test(pcRaw) && /^\d+/.test(nrRaw);

    const tried = st.tried || 0;

    // Dakscore: zelfde formule als de Vermeulen dakscan (src/components/dakscan/scan.ts, bereken()).

    const DAKTYPE_TXT = { plat: 'Plat dak', schuin: 'Hellend dak', combinatie: 'Plat en hellend', onbekend: 'Onbekend' };
    const gedeeld = !!(scan && scan.adressen > 1);

    const LEVENSDUUR = { plat: 25, schuin: 50, combinatie: 35, onbekend: 40 };
    const CURVE = [[0, 9.6], [0.5, 8.4], [0.8, 7.0], [1.0, 5.8], [1.3, 4.0], [1.7, 2.8]];
    const TYPE_CORRECTIE = { plat: -0.6, combinatie: -0.3, schuin: 0, onbekend: -0.3 };
    const GRENS_GROEN = 7.5, GRENS_ORANJE = 5.5, SCORE_ONBEKEND = 6.0;
    const LEEFTIJD_VERNIEUWD = { 'Minder dan 10 jaar geleden': 5, '10 tot 20 jaar geleden': 15, 'Meer dan 20 jaar geleden': 25 };
    const KLACHTEN_AFTREK = 2.0, KLACHTEN_MAX = 5.4;
    const lerp = (x) => { if (x <= CURVE[0][0]) return CURVE[0][1]; for (let i = 1; i < CURVE.length; i++) { const [x1, y1] = CURVE[i], [x0, y0] = CURVE[i - 1]; if (x <= x1) return y0 + ((x - x0) / (x1 - x0)) * (y1 - y0); } return CURVE[CURVE.length - 1][1]; };

<script>
/* Antwoorden uit de dakscan-balk op de homepage overnemen: adres en "dak vernieuwd?" zijn dan al ingevuld.

(function(){
  var d = null;
  try { d = JSON.parse(sessionStorage.getItem('bruck-dakscan') || 'null'); sessionStorage.removeItem('bruck-dakscan'); } catch (e) {}
  if (!d || !window.__comp) return;
  var st = {};
  var pc = (d.pc || '').trim(), nr = (d.nr || '').trim();
  var m = nr.match(/^(\d+)\s*-?\s*(.*)$/);
  if (pc) st.pc = pc;
  if (nr) st.nr = nr; // huisnummer met eventuele toevoeging in één veld ("12A")
  var Q1 = ['Nee', 'Minder dan 10 jaar geleden', '10 tot 20 jaar geleden', 'Meer dan 20 jaar geleden', 'Weet ik niet'];
  if (Q1.indexOf(d.q1) > -1) { st.q1 = d.q1; st.q1Pre = true; }
  window.__comp.setState(st);
  if (/^\d{4}\s?[A-Za-z]{2}$/.test(pc) && m) window.__comp.zoek();
