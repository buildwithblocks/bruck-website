<script>

class DCLogic{constructor(){this.state={};this.props={};}setState(p){Object.assign(this.state,p);window.__dcUpdate&&window.__dcUpdate();}}

class Component extends DCLogic {
  // Adres opzoeken en de dakgegevens ophalen (js/dakscan-data.js). Bij succes door naar stap 2.
  async zoek() {
    const st = this.state || {};
    const pc = (st.pc || '').trim(), nr = (st.nr || '').trim(), toev = (st.toev || '').trim();
    if (!/^\d{4}\s?[A-Za-z]{2}$/.test(pc) || !/^\d+/.test(nr)) { this.setState({ tried: 1 }); return; }
    if (st.zoeken || !window.BruckScan) return;
    this.setState({ zoeken: true, zoekFout: '', keuzes: null, tried: 0 });
    try {
      const r = await window.BruckScan.zoekAdres(pc, nr, toev);
      if (!r) { window.meet && window.meet('Dakscan: adres niet gevonden'); this.setState({ zoeken: false, zoekFout: 'We vinden dit adres niet. Controleer je postcode, huisnummer en toevoeging.' }); return; }
      if (r.keuzes) {
        this.setState({ zoeken: false, keuzes: r.keuzes });
        const box = document.getElementById('ds-keuzes');
        if (box) {
          box.innerHTML = '';
          r.keuzes.forEach((a) => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'ds-opt'; b.textContent = a.straat + ' ' + a.huis;
            b.style.cssText = 'min-height: 48px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.12); background: #1F1F1F; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer';
            b.addEventListener('click', () => { const m = a.huis.match(/^(\d+)\s*-?\s*(.*)$/); this.setState({ nr: m ? m[1] : a.huis, toev: m ? m[2] : '', keuzes: null }); this.zoek(); });
            box.appendChild(b);
          });
        }
        return;
      }
      const scan = await window.BruckScan.scanDak(r.adres);
      window.meet && window.meet('Dakscan: adres gevonden');
      this.setState({ zoeken: false, scan: scan, step: 2 });
      try { window.scrollTo(0, 0); } catch (e) {}
    } catch (e) {
      this.setState({ zoeken: false, zoekFout: 'Het opzoeken lukte niet. Probeer het nog eens.' });
    }
  }
  renderVals() {
    const __navSolid = !!(this.state && this.state.navSolid);
    if (!this.__solidBound && typeof window !== 'undefined') {
      this.__solidBound = true;
      const chk = () => { const v = (window.scrollY || 0) > 10; if (v !== !!(this.state && this.state.navSolid)) this.setState({ navSolid: v }); };
      window.addEventListener('scroll', chk, { passive: true }); chk();
    }
    const __navHidden = !!(this.state && this.state.navHidden);
    if (!this.__navBound && typeof window !== 'undefined') {
      this.__navBound = true;
      let lastY = window.scrollY || 0;
      window.addEventListener('scroll', () => {
        const y = window.scrollY || 0;
        if (Math.abs(y - lastY) < 6) return;
        const hide = false;
        lastY = y;
        if (hide !== !!(this.state && this.state.navHidden)) this.setState(hide ? { navHidden: true, menuOpen: false } : { navHidden: false });
      }, { passive: true });
    }
    const st = this.state || {};
    const open = !!st.menuOpen;
    const hv = st.hover;
    const active = '';
    const navLinks = ['Projecten', 'Over ons', 'Contact'].map((label) => ({
