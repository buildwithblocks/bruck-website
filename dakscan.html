class DCLogic{constructor(){this.state={};this.props={};}setState(p){Object.assign(this.state,p);window.__dcUpdate&&window.__dcUpdate();}}

class Component extends DCLogic {
  // Adres opzoeken en de dakgegevens ophalen (js/dakscan-data.js). Bij succes door naar stap 2.
  // Laadscherm zoals Vermeulen: vier stappen die na elkaar afvinken, en minimaal 2,6 s (na een keuze 2 s),
  // zodat de scan niet "te snel" voelt.
  _laadStart(minMs) {
    (this._timers || []).forEach(clearTimeout);
    this._timers = [600, 1200, 1800].map((t, i) => setTimeout(() => this.setState({ laadIdx: i + 1 }), t));
    this.setState({ laden: true, laadIdx: 0, nf: false, zoekFout: '', keuzes: null, tried: 0 });
    return new Promise((r) => this._timers.push(setTimeout(r, minMs)));
  }
  _laadStop(extra) { (this._timers || []).forEach(clearTimeout); this.setState(Object.assign({ laden: false, zoeken: false }, extra || {})); }
  async zoek() {
    const st = this.state || {};
    const pc = (st.pc || '').trim(), nr = (st.nr || '').trim(), toev = '';
    if (!/^\d{4}\s?[A-Za-z]{2}$/.test(pc) || !/^\d+/.test(nr)) { this.setState({ tried: 1 }); return; }
    if (st.zoeken || !window.BruckScan) return;
    this.setState({ zoeken: true });
    const minTijd = this._laadStart(2600);
    try {
      const r = await window.BruckScan.zoekAdres(pc, nr, toev);
      if (!r) {
        window.meet && window.meet('Dakscan: adres niet gevonden');
        await minTijd;
        this._laadStop({ nf: true, nfFout: '' });
        try { window.scrollTo(0, 0); } catch (e) {}
        return;
      }
      if (r.keuzes) {
        this._laadStop({ keuzes: r.keuzes });
        window.meet && window.meet('Dakscan: toevoeging kiezen', { aantal: r.keuzes.length });
        const box = document.getElementById('ds-keuzes');
        if (box) {
          box.innerHTML = '';
          r.keuzes.forEach((a) => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'ds-opt'; b.textContent = a.straat + ' ' + a.huis;
            b.style.cssText = 'min-height: 48px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.12); background: #1F1F1F; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer';
            b.addEventListener('click', () => { this.setState({ nr: a.huis, toev: '', keuzes: null }); this.scanAdres(a); });
            box.appendChild(b);
          });
        }
        return;
      }
      this.setState({ laadAdres: r.adres.straat + ' ' + r.adres.huis + ', ' + r.adres.plaats });
      const [scan] = await Promise.all([window.BruckScan.scanDak(r.adres), minTijd]);
      window.meet && window.meet('Dakscan: adres gevonden');
      this._laadStop({ scan: scan, step: 2 });
      try { window.scrollTo(0, 0); } catch (e) {}
    } catch (e) {
      this._laadStop({ zoekFout: 'Het opzoeken lukte niet. Probeer het nog eens.' });
    }
  }
  // Gekozen adres uit de lijst met toevoegingen: meteen scannen, zonder nieuwe adrescontrole

  async scanAdres(adres) {
    if ((this.state || {}).zoeken || !window.BruckScan) return;
    this.setState({ zoeken: true, laadAdres: adres.straat + ' ' + adres.huis + ', ' + adres.plaats });
    const minTijd = this._laadStart(2000);
    try {
      const [scan] = await Promise.all([window.BruckScan.scanDak(adres), minTijd]);
      window.meet && window.meet('Dakscan: adres gevonden', { via: 'toevoeging' });
      this._laadStop({ scan: scan, step: 2 });
      try { window.scrollTo(0, 0); } catch (e) {}
    } catch (e) {
      this._laadStop({ zoekFout: 'Het opzoeken lukte niet. Probeer het nog eens.' });
    }
  }
  renderVals() {

    const LEVENSDUUR = { plat: 25, schuin: 50, combinatie: 35, onbekend: 40 };

    const GRENS_GROEN = 7.5, GRENS_ORANJE = 5.5, SCORE_ONBEKEND = 6.0;
    const LEEFTIJD_VERNIEUWD = { 'Minder dan 10 jaar geleden': 5, '10 tot 20 jaar geleden': 15, 'Meer dan 20 jaar geleden': 25 };
    const KLACHTEN_AFTREK = 2.0, KLACHTEN_MAX = 5.4;
    const lerp = (x) => { if (x <= CURVE[0][0]) return CURVE[0][1]; for (let i = 1; i < CURVE.length; i++) { const [x1, y1] = CURVE[i], [x0, y0] = CURVE[i - 1]; if (x <= x1) return y0 + ((x - x0) / (x1 - x0)) * (y1 - y0); } return CURVE[CURVE.length - 1][1]; };
    const renewV = st.q1 || 'Weet ik niet', leakV = st.q2 || 'Nee';

    const woning = BOUWJAAR ? Math.max(0, new Date().getFullYear() - BOUWJAAR) : undefined;
    const vern = LEEFTIJD_VERNIEUWD[renewV];
    const leeftijd = vern !== undefined ? Math.min(vern, woning ?? vern) : woning;
    let raw = leeftijd === undefined ? SCORE_ONBEKEND : lerp(leeftijd / levensduur) + TYPE_CORRECTIE[DAKTYPE];
    if (leakV === 'Ja') raw = Math.min(KLACHTEN_MAX, raw - KLACHTEN_AFTREK);
    const sc = Math.round(Math.min(9.8, Math.max(1.5, raw)) * 10) / 10;
    // Zelfde afgeleide teksten als Vermeulen (teksten.ts / scan.ts).
    const UITKOMST = sc >= GRENS_GROEN ? 'groen' : sc >= GRENS_ORANJE ? 'oranje' : 'rood';
    const SCORE_TXT = {
      groen: ['Je dak ziet er goed uit', 'Op basis van de gegevens lijkt je dak in goede staat. Wil je zeker weten dat alles klopt? Dan komt Nicky vrijblijvend even kijken.', '#7CC68D'],
      oranje: ['Je dak verdient aandacht', 'De gegevens laten signalen zien die we serieus nemen. Nu nog klein, maar wachten maakt het groter.', '#E8913A'],
      rood: ['Je dak heeft snel actie nodig', 'De gegevens en je antwoorden wijzen op een dak dat snel aandacht nodig heeft. Lekt het nu? Bel Nicky direct op 06 19 62 33 66.', '#E5674F'],
    };
    const PUNTEN = {
      groen: [['Laat je dakgoten één keer per jaar controleren, zeker onder bomen.', 'alle'], ['Controleer na een storm of pannen en nokvorsten nog goed liggen.', 'schuin'], ['Houd je platte dak vrij van bladeren en takken, zodat het water weg kan.', 'plat']],
      oranje: [['Daken van deze leeftijd hebben vaak last van verschoven of poreuze pannen.', 'schuin'], ['Op een plat dak van deze leeftijd zie je vaak blazen, scheuren of losse naden.', 'plat'], ['Controleer de dakgoten en het lood rond de schoorsteen.', 'alle']],
      rood: [['Bij oudere bitumen daken zie je vaak blaasvorming en naadlekkage.', 'plat'], ['Bij oudere pannendaken zie je vaak poreuze pannen en loszittende nokvorsten.', 'schuin'], ['Laat het dak op korte termijn inspecteren.', 'alle']],
    };
    const punten = PUNTEN[UITKOMST].filter(([, t]) => t === 'alle' || DAKTYPE === 'combinatie' || t === DAKTYPE).map(([p]) => p);
    const rest = leeftijd === undefined ? undefined : levensduur - leeftijd;
    const leeftijdKlasse = leeftijd === undefined ? 'Onbekend' : leeftijd >= 45 ? '45+ jaar' : leeftijd >= 30 ? '30–45 jaar' : leeftijd >= 20 ? '20–30 jaar' : leeftijd >= 10 ? '10–20 jaar' : '0–10 jaar';
    const levensduurTxt = rest === undefined ? 'Onbekend' : rest >= levensduur * 0.4 ? 'Nog ruim ' + Math.max(5, Math.floor(rest / 5) * 5) + ' jaar' : rest > 0 ? 'Einde levensduur in zicht' : 'Levensduur verstreken';
    const hellingTxt = !scan ? 'Onbekend' : DAKTYPE === 'plat' ? 'Vrijwel vlak' : scan.helling ? 'ca. ' + scan.helling + '°' : 'Onbekend';
    const oppDelen = scan && scan.oppervlakSchuin && scan.oppervlakPlat ? scan.oppervlakSchuin + ' m² schuin + ' + scan.oppervlakPlat + ' m² plat' : '';
    const VERN_KEY = { 'Nee': 'nee', 'Minder dan 10 jaar geleden': 'recent', '10 tot 20 jaar geleden': 'middel', 'Meer dan 20 jaar geleden': 'lang', 'Weet ik niet': 'weetniet' };
    const band = SCORE_TXT[UITKOMST]; const bandOud = sc >= GRENS_GROEN ? ['Goed', 'Je dak lijkt in goede staat.', '#7CC68D'] : sc >= GRENS_ORANJE ? ['Verdient aandacht', 'Nu nog klein, maar wachten maakt het groter.', '#E8913A'] : ['Snel actie nodig', 'Laat je dak op korte termijn nakijken.', '#E05A4E'];
    const ok = st.ok !== false;
    const go = (n) => () => { this.setState({ step: n, tried: 0 }); try { window.scrollTo(0, 0); } catch (e) {} };
    // Aanvraag versturen (api/lead.js -> Resend). Pas na succes naar het bedankscherm.

      scan: scan ? {
        adres: { weergave: scan.adres.weergave, straat: scan.adres.straat, huis: scan.adres.huis, postcode: scan.adres.postcode, plaats: scan.adres.plaats, gemeente: scan.adres.gemeente, rd: scan.adres.rd },

        antwoorden: { vernieuwd: VERN_KEY[renewV], klachten: leakV === 'Ja' },

    const submit = async () => {

        go(5)();
      } catch (e) {

      }

    const verstuurNf = async () => {

    return {
