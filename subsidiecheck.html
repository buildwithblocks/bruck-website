      const f=()=>{w.style.display=get(vp,scope)?'contents':'none'};f();binds.push(f);
      Array.from(w.childNodes).forEach(c=>walk(c,scope));return;
    }
    Array.from(node.attributes).forEach(a=>{
      const n=a.name,v=a.value;
      if(n.startsWith('hint-')){node.removeAttribute(n);return;}
      if(/^on/i.test(n)&&/\{\{/.test(v)){node.removeAttribute(n);const p=v.replace(/[{}\s]/g,'');
        const ev={onclick:'click',onmouseenter:'mouseenter',onmouseleave:'mouseleave',onchange:'input'}[n.toLowerCase()]||n.slice(2).toLowerCase();
        node.addEventListener(ev,e=>{const fn=get(p,scope);if(typeof fn==='function'){if(ev==='click'&&node.tagName==='A'&&node.getAttribute('href')==='#')e.preventDefault();fn(e);}});return;}
      if(/\{\{/.test(v)){const f=()=>{const x=interp(v,scope);node.setAttribute(n,x);if(n==='value'&&node.value!==x)node.value=x;};f();binds.push(f);}
    });
    if(tag==='a'&&node.getAttribute('href')==='#')node.addEventListener('click',e=>e.preventDefault());
    Array.from(node.childNodes).forEach(c=>walk(c,scope));
  }
  const root=document.getElementById('dc-root');
  const t=document.getElementById('dc-tpl').content.cloneNode(true);
  Array.from(t.childNodes).forEach(c=>walk(c,{}));root.appendChild(t);
  window.__comp=comp;window.__dcUpdate=()=>{vals=comp.renderVals();binds.forEach(f=>f());};
})();

</script>

<script>
/* Subsidiecheck (overgenomen van Vermeulen, design/SUBSIDIECHECK.md): adres -> eventueel toevoeging kiezen ->

(function () {

  var OPSLAG = 'bruck-subsidiecheck';
  var ARR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>';
  var SLOT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="4.5" y="10.5" width="15" height="10" rx="1"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>';
  var ALERT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 7.5v5.5M12 16.2v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>';
  var VINK = '<svg width="18" height="18" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6.2 5 8.5l4.5-5" stroke="#0B0B0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  var VINKG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#DFA701" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M20 6 9 17l-5-5"></path></svg>';
  var STER = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex:none"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>';
  var PIN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DFA701" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>';
  var HUIS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DFA701" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9v12h14V9"></path><path d="M10 21v-6h4v6"></path></svg>';
  var PERS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DFA701" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>';
  var MAIL = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DFA701" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="2" y="4" width="20" height="16" rx="1"></rect><path d="m22 6-10 7L2 6"></path></svg>';
  var TEL = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DFA701" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>';

  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var euro = function (n) { return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n); };
  var euroKort = function (n) { return '€' + n.toLocaleString('nl-NL', { maximumFractionDigits: 0 }); };
  var euroM2 = function (n) { return '€' + n.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var m2 = function (n) { return n.toLocaleString('nl-NL') + ' m²'; };
  var letters = function (t) { return t.split('').map(function (c, i) { return '<span class="ch" aria-hidden="true" style="--i: ' + i + '">' + (c === ' ' ? ' ' : esc(c)) + '</span>'; }).join(''); };
  var knopP = function (label, extra, attrs) { return '<button type="' + ((attrs && attrs.type) || 'button') + '" class="btn-p sc-knop' + (extra ? ' ' + extra : '') + '"' + ((attrs && attrs.id) ? ' id="' + attrs.id + '"' : '') + '><span class="btn-t st" aria-label="' + esc(label) + '">' + letters(label) + '</span><span class="btn-ar" aria-hidden="true">' + ARR + '</span></button>'; };
  var knopS = function (label, id) { return '<button type="button" class="btn-s sc-knop sc-knop2" id="' + id + '"><span class="btn-t st" aria-label="' + esc(label) + '">' + letters(label) + '</span></button>'; };
  var geldig = function (pc, nr) { return /^\d{4}\s?[a-zA-Z]{2}$/.test(String(pc).trim()) && /^\d+/.test(String(nr).trim()); };
  var emailOk = function (e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim()); };
  var telOk = function (t) { return t.replace(/\D/g, '').length >= 10; };

  var st = { step: 'adres', pc: '', nr: '', busy: false, fout: null, keuzes: [], w: null, open: false, naam: '', f: { naam: '', email: '', tel: '', akkoord: true }, sending: false, sendErr: null };
  var run = 0, app;

  function bereken() {
    var w = st.w, dak = w && w.dak;
    var m = dak !== undefined && dak !== null ? dak : TARIEF.m2, geschat = !(dak > 0);
    var gerekend = Math.min(Math.max(0, m), TARIEF.max), onder = !(m >= TARIEF.min), tarief = TARIEF.tarief1;
    var bedrag = onder ? 0 : Math.round(gerekend * tarief);
    return { m2: m, gerekend: gerekend, onder: onder, tarief: tarief, bedrag: bedrag, geschat: geschat, totaal: bedrag };
  }
  function regelTekst(r) { return r.onder ? 'Minder dan ' + TARIEF.min + ' m²: geen ISDE' : m2(r.gerekend) + ' × ' + euroM2(r.tarief) + '/m²' + (r.geschat ? ' (geschat)' : ''); }

  /* Woninggegevens per adres uit de dakscan-data: oppervlaktes gedeeld door het aantal adressen in het pand. */
  function woning(scan) {
    var n = Math.max(1, scan.adressen || 1), per = function (v) { return v && v > 0 ? Math.round(v / n) || undefined : undefined; };
    var schuin = per(scan.oppervlakSchuin), plat = per(scan.oppervlakPlat);
    return { adres: scan.adres, bouwjaar: scan.bouwjaar, adressen: n, gebruiksdoel: scan.gebruiksdoel, pandId: scan.pandId,
      dak: schuin || plat ? (schuin || 0) + (plat || 0) : undefined, dakSchuin: schuin, dakPlat: plat,
      luchtfoto: scan.luchtfoto, punten: scan.punten };
  }

  /* ---------- weergave ---------- */
  function notice(t) { return '<div class="sc-notice" role="alert">' + ALERT + '<span>' + t + '</span></div>'; }
  function veld(id, label, icon, waarde, ph, attrs) {
    return '<label class="ds-field sc-veld" for="' + id + '">' + icon + '<span style="flex:1;min-width:0"><span class="sc-veld-t">' + label + '</span><input id="' + id + '" value="' + esc(waarde) + '" placeholder="' + esc(ph) + '" ' + (attrs || '') + '></span></label>';
  }
  function badge() { return '<span class="sc-badge">' + STER + 'Bereken je subsidie in 1 minuut</span>'; }

  /* Startscherm: adresbalk (postcode, huisnummer, knop) met drie vinkjes eronder. */
  function stapAdres() {
    var knop = st.busy
      ? '<button type="submit" class="btn-p sc-knop" disabled aria-busy="true"><span class="sc-spin" style="border-color:rgba(11,11,11,.25);border-top-color:#0B0B0B"></span>We zoeken je dak op</button>'
      : knopP('Bereken mijn subsidie', '', { type: 'submit' });
    return '<form id="sc-adres" novalidate>' +
      '<div class="sc-balkform">' + veld('sc-pc', 'Postcode', PIN, st.pc, '1234 AB', 'name="postcode" autocomplete="postal-code"') + veld('sc-nr', 'Huisnummer', HUIS, st.nr, '12a', 'name="huisnummer"') + knop + '</div>' +
      (st.fout === 'niet' ? '<div style="margin-top:12px">' + notice('Dit adres is niet gevonden. Controleer je postcode en huisnummer.') + '</div>' : '') +
      (st.fout === 'netwerk' ? '<div style="margin-top:12px">' + notice('Het opzoeken van je adres lukte niet. Controleer je verbinding en probeer het opnieuw.') + '</div>' : '') +
      '<ul class="sc-vinkjes">' + ['Bereken je maximale subsidie', 'Geheel vrijblijvend', 'Binnen 1 minuut'].map(function (t) { return '<li>' + VINKG + t + '</li>'; }).join('') + '</ul>' +
      '</form>';
  }
  function stapToevoeging() {
    var k = st.keuzes[0], kop = k ? k.straat + ' ' + parseInt(k.huis, 10) : '';
    return '<div class="sc-kaart sc-stack"><div class="sc-kop"><h2 class="sc-h2">Kies je adres</h2><p class="sc-p">Op ' + esc(kop) + ' staan meerdere adressen. Kies het jouwe.</p></div>' +
      '<div class="sc-keuzes">' + st.keuzes.map(function (a, i) { return '<button type="button" class="sc-keuze" data-keuze="' + i + '">' + esc(a.straat + ' ' + a.huis) + '</button>'; }).join('') + '</div>' +
      (st.busy ? '<span class="sc-laden"><span class="sc-spin"></span>We zoeken je dak op</span>' : '') +
      '<button type="button" class="sc-link" id="sc-anders">Ander adres invullen</button></div>';
  }
  function totaalKaart(r) {
    var adres = st.w.adres.straat + ' ' + st.w.adres.huis;
    var tekst = st.open ? euroKort(r.totaal) : euroKort(r.totaal).replace(/\d/g, '8');
    var sub = st.open && !r.geschat ? 'Op basis van ' + m2(r.gerekend) + ' dak' : st.open ? 'Op basis van een standaard dak van ' + m2(r.gerekend) : 'Dakisolatie';
    return '<div class="sc-totaal"><div class="sc-totaal-l">Jouw subsidie voor dakisolatie op ' + esc(adres) + '</div>' +
      '<div class="sc-totaal-rij">' + (st.open ? '<span class="sc-bedrag">' + tekst + '</span>' :
        '<span class="sc-bedrag sc-blur" aria-hidden="true">' + tekst + '</span><span class="sc-slotpil">' + SLOT + 'Bekijk je subsidiebedrag</span>') +
      '</div><div class="sc-totaal-s">' + sub + '</div></div>';
  }
  function foto(minH, mini) {
    var w = st.w;
    return '<div class="sc-foto' + (mini ? ' sc-foto-mini' : '') + '"' + (mini ? '' : ' style="min-height:' + minH + 'px"') + '>' + (w.luchtfoto ? '<img src="' + esc(w.luchtfoto) + '" alt="Luchtfoto van ' + esc(w.adres.weergave) + '" onload="this.classList.add(\'ok\');var s=this.nextElementSibling;if(s)s.classList.add(\'ok\')">' : '') +
      (w.punten ? '<svg class="sc-contour" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><polygon points="' + w.punten + '" fill="rgba(223,167,1,0.18)" stroke="#DFA701" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polygon></svg>' : '') +
      (mini ? '' : '<span class="sc-fotolabel"><span></span>Jouw woning</span>') + '</div>';
  }
  function formulier() {
    var f = st.f, ok = formOk();
    return '<form id="sc-form" novalidate class="sc-kaart sc-kaart-d sc-stack" style="gap:16px">' +
      '<div class="sc-kop" style="gap:10px"><h3 class="sc-h3">Bekijk je subsidiebedrag</h3><p class="sc-p" style="font-size:15px">Vul je gegevens in. Je ziet het bedrag direct en krijgt het ook per mail.</p></div>' +
      veld('sc-naam', 'Naam', PERS, f.naam, 'Voor- en achternaam', 'autocomplete="name"') +
      veld('sc-email', 'E-mailadres', MAIL, f.email, 'naam@voorbeeld.nl', 'type="email" inputmode="email" autocomplete="email"') +
      veld('sc-tel', 'Telefoonnummer', TEL, f.tel, '06 12 34 56 78', 'type="tel" inputmode="tel" autocomplete="tel"') +
      '<label class="sc-check"><input type="checkbox" id="sc-akk"' + (f.akkoord ? ' checked' : '') + '><span class="sc-vak">' + VINK + '</span><span>Ik ga ermee akkoord dat mijn contactgegevens gebruikt worden om contact met mij op te nemen. Lees de <a href="privacy.html" target="_blank" rel="noopener">privacy policy</a>.</span></label>' +
      '<input type="text" id="sc-hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">' +
      (st.sendErr ? notice(st.sendErr) : '') +
      '<button type="submit" class="btn-p sc-knop sc-vol" id="sc-verstuur"' + (ok && !st.sending ? '' : ' disabled') + '>' + SLOT + '<span class="btn-t st" aria-label="Bekijk mijn subsidiebedrag">' + letters(st.sending ? 'Even geduld' : 'Bekijk mijn subsidiebedrag') + '</span></button>' +
      '<button type="button" class="sc-link" id="sc-opnieuw" style="align-self:center">Opnieuw berekenen</button></form>';
  }
  function feitenVan(w) {
    var type = w.adressen > 1 ? 'Pand met ' + w.adressen + ' adressen' : w.gebruiksdoel === 'woonfunctie' ? 'Eengezinswoning' : '';
    return { type: type, dak: w.dak ? m2(w.dak) : '' };
  }
  /* Variant C: smalle gele balk met foto, adres, woninggegevens en het vervaagde bedrag; formulier direct eronder. */
  function afgeschermd() {
    var r = bereken(), w = st.w, f = feitenVan(w), a = w.adres;
    var plaats = [a.postcode ? a.postcode.replace(/^(\d{4})(\w{2})$/, '$1 $2') : '', a.plaats || ''].filter(Boolean).join(' ');
    return '<div class="sc-stack">' +
      '<div class="sc-balk">' + foto(0, true) +
        '<div class="sc-balk-adres"><small>Je dak is gevonden</small><b>' + esc(a.straat + ' ' + a.huis) + '</b><span class="sc-balk-plaats">' + esc(plaats) + '</span>' +
          '<div class="sc-balk-feiten">' + (w.bouwjaar ? '<span>Bouwjaar <b>' + w.bouwjaar + '</b></span>' : '') + (f.dak ? '<span>Dak <b>' + f.dak + '</b></span>' : '') + (f.type ? '<span>' + esc(f.type) + '</span>' : '') + '</div></div>' +
        '<div class="sc-balk-geld"><small>Jouw subsidie</small><span class="sc-bedrag sc-blur" aria-hidden="true">' + euroKort(r.totaal).replace(/\d/g, '8') + '</span></div>' +
      '</div>' +
      '<div class="sc-split sc-split-c">' + formulier() + foto(520) + '</div></div>';
  }
  function ontgrendeld() {
    var r = bereken(), w = st.w;
    var type = w.adressen > 1 ? 'Pand met ' + w.adressen + ' adressen' : w.gebruiksdoel === 'woonfunctie' ? 'Eengezinswoning' : '';
    var delen = w.dakSchuin && w.dakPlat ? m2(w.dakSchuin) + ' schuin + ' + m2(w.dakPlat) + ' plat' : '';
    var feiten = [['Bouwjaar', w.bouwjaar ? String(w.bouwjaar) : 'Onbekend']].concat(type ? [['Woningtype', type]] : []).concat([['Dakoppervlak', w.dak ? m2(w.dak) : 'Onbekend', delen]]);
    return '<div class="sc-stack">' +
      '<div class="sc-status" role="status"><span class="sc-statusdot">' + VINK + '</span><div><h2 class="sc-h3">Bedankt, ' + esc(st.naam) + '!</h2><p class="sc-p" style="font-size:15px;margin-top:6px">We nemen zo snel mogelijk contact met je op. Hieronder zie je wat dakisolatie je aan subsidie oplevert.</p></div></div>' +
      totaalKaart(r) +
      '<div class="sc-split sc-split-top"><div class="sc-stack" style="gap:14px"><h3 class="sc-h3">Landelijke subsidies</h3>' +
        '<div class="sc-regel"><span class="sc-regel-l">Dakisolatie</span><span class="sc-regel-t">ISDE (Investeringssubsidie Duurzame Energie)</span><p class="sc-regel-p">Isolatie van je hellende of platte dak, aan de binnen- of buitenkant.</p><div class="sc-lijn"></div><div class="sc-regel-o"><span' + (r.onder ? ' style="color:#DFA701"' : '') + '>' + regelTekst(r) + '</span><b>' + euroKort(r.bedrag) + '</b></div></div></div>' +
        '<div class="sc-stack" style="gap:14px"><h3 class="sc-h3">Subsidies van je gemeente</h3><div class="sc-leeg">Geen gemeentelijke subsidies gevonden' + (w.adres.gemeente ? ' voor ' + esc(w.adres.gemeente) : ' voor jouw postcode') + '.</div></div></div>' +
      '<div class="sc-kaart sc-woning">' + foto(340) + '<div class="sc-stack" style="gap:16px;min-width:0"><div><h3 class="sc-h3">Jouw woning</h3><span class="sc-adres">' + esc(w.adres.weergave) + '</span></div>' +
        '<div class="sc-feiten">' + feiten.map(function (x) { return '<div class="sc-feit' + (x[1].length > 11 || x[2] ? ' sc-breed' : '') + '"><span>' + x[0] + '</span><b>' + esc(x[1]) + '</b>' + (x[2] ? '<small>' + x[2] + '</small>' : '') + '</div>'; }).join('') + '</div>' +
        '<p class="sc-p" style="font-size:15px">Benieuwd hoe je dak ervoor staat? Doe de gratis dakscan voor jouw adres.</p>' +
        '<div class="sc-knoppen">' + knopP('Start dakscan', '', { id: 'sc-dakscan' }) + knopS('Opnieuw berekenen', 'sc-opnieuw') + '</div></div></div>' +
      '<p class="sc-disclaimer">Het dakoppervlak is geschat uit openbare gegevens (BAG en 3D BAG). Tijdens het bezoek meet Nicky je dak precies op. Aan deze berekening kun je geen rechten ontlenen.</p></div>';
  }

  function render(scroll) {
    var res = st.step === 'resultaat' && st.w;
    var html = res ? (st.open ? ontgrendeld() : afgeschermd()) : st.step === 'toevoeging' ? stapToevoeging() : stapAdres();
    var sec = document.getElementById('subsidiecheck');
    if (sec) sec.classList.toggle('sc-res', !!res);

    bind();
    if (scroll) {
      var top = app.getBoundingClientRect().top;
      // In de resultaatstap altijd naar het resultaat (de intro is dan weg); anders alleen als het uit beeld is.
      if (res || top < 0 || top > innerHeight * 0.6) scrollTo({ top: Math.max(0, scrollY + top - 110), behavior: 'smooth' });
    }
  }
  function formOk() { var f = st.f; return f.naam.trim().length > 1 && emailOk(f.email) && telOk(f.tel) && f.akkoord; }

  function bind() {
    var $ = function (id) { return document.getElementById(id); };
    var a = $('sc-adres');
    if (a) {
      $('sc-pc').addEventListener('input', function (e) { st.pc = e.target.value; });
      $('sc-nr').addEventListener('input', function (e) { st.nr = e.target.value; });
      a.addEventListener('submit', function (e) { e.preventDefault(); zoek(); });
    }

    if ($('sc-anders')) $('sc-anders').addEventListener('click', function () { run++; st.busy = false; st.step = 'adres'; render(); });
    app.querySelectorAll('#sc-opnieuw').forEach(function (b) { b.addEventListener('click', opnieuw); });
    var f = $('sc-form');
    if (f) {
      var upd = function () { var k = $('sc-verstuur'); if (k) k.disabled = !formOk() || st.sending; };
      [['sc-naam', 'naam'], ['sc-email', 'email'], ['sc-tel', 'tel']].forEach(function (p) { $(p[0]).addEventListener('input', function (e) { st.f[p[1]] = e.target.value; upd(); }); });
      $('sc-akk').addEventListener('change', function (e) { st.f.akkoord = e.target.checked; upd(); });
      f.addEventListener('submit', function (e) { e.preventDefault(); verstuur(); });
    }
    if ($('sc-dakscan')) $('sc-dakscan').addEventListener('click', function () {
      try { sessionStorage.setItem('bruck-dakscan', JSON.stringify({ pc: st.w.adres.postcode, nr: st.w.adres.huis, q1: '' })); } catch (x) {}
      location.href = 'dakscan.html';
    });
  }

  function laad(adres, id) {
    st.busy = true; render();
    window.BruckScan.scanDak(adres).then(function (scan) { return woning(scan); }, function () { return { adres: adres, adressen: 1 }; }).then(function (w) {
      if (run !== id) return;
      st.w = w; st.busy = false; st.open = false; st.step = 'resultaat'; render(true);
      window.meet && window.meet('Subsidiecheck: adres ingevuld', { dak: w.dak || 0 });
    });
  }
  function zoek() {
    if (st.busy) return;
    if (!geldig(st.pc, st.nr)) { st.fout = 'niet'; render(); return; }
    var id = ++run; st.fout = null; st.busy = true; render();
    window.BruckScan.zoekAdres(st.pc, st.nr).then(function (res) {
      if (run !== id) return;
      if (!res) { st.busy = false; st.fout = 'niet'; render(); return; }
      if (res.keuzes) { st.busy = false; st.keuzes = res.keuzes; st.step = 'toevoeging'; render(true); return; }
      laad(res.adres, id);
    }, function () { if (run === id) { st.busy = false; st.fout = 'netwerk'; render(); } });
  }
  function kies(a) { if (st.busy || !a) return; st.nr = a.huis; laad(a, ++run); }
  function opnieuw() {
    run++; try { sessionStorage.removeItem(OPSLAG); } catch (x) {}
    st.step = 'adres'; st.w = null; st.keuzes = []; st.fout = null; st.busy = false; st.open = false; st.sendErr = null; st.naam = ''; render(true);
  }
  function verstuur() {
    if (!formOk() || st.sending || !st.w) return;
    st.sending = true; st.sendErr = null; render();
    var w = st.w, r = bereken(), delen = w.dakSchuin && w.dakPlat ? ' (' + m2(w.dakSchuin) + ' schuin + ' + m2(w.dakPlat) + ' plat)' : '';
    var body = { type: 'subsidie', naam: st.f.naam.trim(), email: st.f.email.trim(), telefoon: st.f.tel.trim(), toestemming: st.f.akkoord,
      adresVol: w.adres.weergave, postcode: w.adres.postcode, huisnummer: w.adres.huis, gemeente: w.adres.gemeente || '', bouwjaar: w.bouwjaar ? String(w.bouwjaar) : '',
      adressen: String(w.adressen), dak: w.dak ? m2(w.dak) + delen : m2(TARIEF.m2) + ' (standaard)', regel: regelTekst(r) + ' = ' + euro(r.bedrag), totaal: euro(r.totaal),
      luchtfoto: w.luchtfoto || '', website: (document.getElementById('sc-hp') || {}).value || '' };
    fetch('/api/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (res) {
      if (!res.ok) throw new Error(res.status === 429 ? 'te-vaak' : String(res.status));
      st.sending = false; st.naam = body.naam.split(/\s+/)[0]; st.open = true;
      try { sessionStorage.setItem(OPSLAG, JSON.stringify({ w: w, naam: st.naam })); } catch (x) {}
      window.meet && window.meet('Lead - Subsidiecheck');
      render(true);
    }).catch(function (e) {
      st.sending = false;
      st.sendErr = e.message === 'te-vaak' ? 'Je hebt net al iets verstuurd. Probeer het over een paar minuten opnieuw of bel Nicky.' : 'Versturen lukte niet. Probeer het opnieuw, of app of bel Nicky op 06 19 62 33 66.';
      render();
    });
  }

  function start() {
    app = document.getElementById('sc-app');
    if (!app || !window.BruckScan) return setTimeout(start, 50);
    try { var o = JSON.parse(sessionStorage.getItem(OPSLAG) || 'null'); if (o && o.w && o.w.adres) { st.w = o.w; st.naam = o.naam || ''; st.open = true; st.step = 'resultaat'; } } catch (x) {}
    render();
  }
  start();
})();
</script>
