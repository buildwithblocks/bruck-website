        <div class="fq" id="met-wie-heb-ik-contact" style="border-bottom: 1px solid rgba(255,255,255,0.15); scroll-margin-top: 130px">

(function(){
  const comp=new Component(); let vals=comp.renderVals();
  const binds=[];
  const H=/\{\{\s*([^}]+?)\s*\}\}/g;
  function get(path,scope){const parts=path.split('.');let v=(parts[0] in scope)?scope[parts[0]]():vals[parts[0]];for(let i=1;i<parts.length;i++){if(v==null)return v;v=v[parts[i]];}return v;}
  function interp(str,scope){return str.replace(H,(m,p)=>{const v=get(p.trim(),scope);return v==null?'':String(v);});}
  function walk(node,scope){
    if(node.nodeType===3){if(H.test(node.nodeValue)){H.lastIndex=0;const tpl=node.nodeValue;const f=()=>{node.nodeValue=interp(tpl,scope)};f();binds.push(f);}H.lastIndex=0;return;}
    if(node.nodeType!==1)return;
    const tag=node.tagName.toLowerCase();
    if(tag==='sc-for'){
      const lp=node.getAttribute('list').replace(/[{}\s]/g,'');const as=node.getAttribute('as');
      const list=get(lp,scope)||[];const frag=document.createDocumentFragment();
      list.forEach((_,i)=>{const sc=Object.assign({},scope);sc[as]=()=>(get(lp,scope)||[])[i];
        Array.from(node.childNodes).forEach(ch=>{const c=ch.cloneNode(true);frag.appendChild(c);walk(c,sc);});});
      node.replaceWith(frag);return;
    }
    if(tag==='sc-if'){
      const vp=node.getAttribute('value').replace(/[{}\s]/g,'');const w=document.createElement('span');w.style.display='contents';
      Array.from(node.childNodes).forEach(ch=>w.appendChild(ch));node.replaceWith(w);
      const f=()=>{w.style.display=get(vp,scope)?'contents':'none'};f();binds.push(f);
      Array.from(w.childNodes).forEach(c=>walk(c,scope));return;
    }
    Array.from(node.attributes).forEach(a=>{
      const n=a.name,v=a.value;
      if(n.startsWith('hint-')){node.removeAttribute(n);return;}
      if(/^on/i.test(n)&&/\{\{/.test(v)){node.removeAttribute(n);const p=v.replace(/[{}\s]/g,'');
        const ev={onclick:'click',onmouseenter:'mouseenter',onmouseleave:'mouseleave',onchange:'input'}[n.toLowerCase()]||n.slice(2).toLowerCase();
        node.addEventListener(ev,e=>{const fn=get(p,scope);if(typeof fn==='function'){if(ev==='click'&&node.tagName==='A'&&node.getAttribute('href')==='#')e.preventDefault();fn(e);}});return;}
      if(/\{\{/.test(v)){const f=()=>{const x=interp(v,scope);node.setAttribute(n,x);if(n==='value'&&node.value!==x)node.value=x;};f();binds.push(f);}
    });
    if(tag==='a'&&node.getAttribute('href')==='#')node.addEventListener('click',e=>e.preventDefault());
    Array.from(node.childNodes).forEach(c=>walk(c,scope));
  }

  window.__comp=comp;window.__dcUpdate=()=>{vals=comp.renderVals();binds.forEach(f=>f());};
})();

<script>
/* FAQ-pagina: openklappen, zoeken, onderwerpmenu dat meeloopt, en direct naar een vraag via #anker. */
(function(){
  function klap(fq, open){
    var b=fq.querySelector('.fq-b'), a=fq.querySelector('.fq-a'), p=a.querySelector('p');
    b.setAttribute('aria-expanded', open?'true':'false');
    a.style.transition=open?'grid-template-rows 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.45s ease 0.05s':'grid-template-rows 0.35s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.2s ease';
    a.style.gridTemplateRows=open?'1fr':'0fr'; a.style.opacity=open?'1':'0';
    p.style.transition=open?'transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)':'transform 0.3s ease'; p.style.transform=open?'translateY(0px)':'translateY(-10px)';
  }
  function start(){
    var lijst=[].slice.call(document.querySelectorAll('.fq')); if(!lijst.length) return setTimeout(start,50);
    document.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('.fq-b'); if(!b) return;
      var fq=b.closest('.fq'); var open=b.getAttribute('aria-expanded')!=='true';
      klap(fq,open); if(open && history.replaceState) history.replaceState(null,'','#'+fq.id);
    });
    // Zoeken
    var z=document.getElementById('fq-zoek'), leeg=document.getElementById('fq-leeg');
    var norm=function(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');};
    z.addEventListener('input',function(){
      var q=norm(z.value.trim()), totaal=0;
      [].forEach.call(document.querySelectorAll('.fq-cat'),function(c){
        var n=0; [].forEach.call(c.querySelectorAll('.fq'),function(fq){ var hit=!q||norm(fq.textContent).indexOf(q)>-1; fq.style.display=hit?'':'none'; if(hit)n++; if(q&&hit)klap(fq,false); });
        c.style.display=n?'':'none'; totaal+=n;
        var nav=document.querySelector('.fq-nav[data-cat="'+c.id+'"]'); if(nav){ nav.style.display=n?'':'none'; nav.querySelector('.fq-n').textContent=n; }
      });
      leeg.style.display=totaal?'none':'block';
    });
    // Onderwerpmenu volgt het scrollen
    var cats=[].slice.call(document.querySelectorAll('.fq-cat')), navs=[].slice.call(document.querySelectorAll('.fq-nav'));
    function actief(){
      var y=window.innerHeight*0.3, id=cats[0].id;
      cats.forEach(function(c){ if(c.style.display!=='none' && c.getBoundingClientRect().top<y) id=c.id; });
      navs.forEach(function(n){ var on=n.getAttribute('data-cat')===id; n.classList.toggle('is-actief',on); if(on&&window.innerWidth<=900&&n.parentNode.scrollWidth>n.parentNode.clientWidth){ var p=n.parentNode; var x=n.offsetLeft-p.clientWidth/2+n.clientWidth/2; if(Math.abs(p.scrollLeft-x)>40) p.scrollTo({left:x,behavior:'smooth'}); } });
    }
    window.addEventListener('scroll',actief,{passive:true}); actief();
    navs.forEach(function(n){ n.addEventListener('click',function(e){ e.preventDefault(); var c=document.getElementById(n.getAttribute('data-cat')); if(c){ c.scrollIntoView({behavior:'smooth'}); if(history.replaceState) history.replaceState(null,'','#'+c.id);} }); });
    // Direct naar een vraag of onderwerp via de url
    var h=decodeURIComponent(location.hash.slice(1)); var doel=h&&document.getElementById(h);
    if(doel){ if(doel.classList.contains('fq')){ klap(doel,true); doel.classList.add('is-doel'); } [60,400,900].forEach(function(t){ setTimeout(function(){ if((window.scrollY||0)<50||t===60) doel.scrollIntoView(); },t); }); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
